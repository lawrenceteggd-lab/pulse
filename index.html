<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pulse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:#f7f8fa; --card:#ffffff; --text:#14171a; --sub:#657786;
    --accent:#6c5ce7; --like:#e0245e; --repost:#17bf63; --border:#e6e8eb;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1115; --card:#1a1d23; --text:#eceff1; --sub:#8b96a3; --border:#2a2e35;
    }
  }
  * { box-sizing:border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height:100%; }
  body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:5;
    padding: calc(14px + env(safe-area-inset-top,0px)) 16px 14px;
    background:var(--bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:19px; margin:0; }
  header h1 span { color:var(--accent); }
  #authArea { font-size:13px; display:flex; align-items:center; gap:8px; }
  #authArea button { background:var(--accent); color:#fff; border:none; border-radius:16px;
    padding:6px 14px; font-size:13px; cursor:pointer; }
  #authArea .ghost { background:none; color:var(--sub); }
  main { max-width:560px; margin:0 auto; padding:12px 12px 32px; }
  #composer { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:16px; }
  #composer textarea { width:100%; border:none; resize:none; background:transparent; color:var(--text);
    font-size:15px; font-family:inherit; outline:none; min-height:44px; }
  #composer .row { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  #charCount { font-size:12px; color:var(--sub); }
  button.post-btn { background:var(--accent); color:#fff; border:none; border-radius:20px;
    padding:8px 18px; font-size:14px; font-weight:600; cursor:pointer; }
  button.post-btn:disabled { opacity:.4; }
  #loginPrompt { background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:16px; text-align:center; color:var(--sub); font-size:14px; }
  #searchInput { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:14px; margin-bottom:12px; }
  .post { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; }
  .post .meta { display:flex; justify-content:space-between; font-size:13px; color:var(--sub); margin-bottom:6px; }
  .post .body { font-size:15px; line-height:1.4; white-space:pre-wrap; }
  .post .body .tag { color:var(--accent); }
  .video-embed { margin-top:10px; border-radius:12px; overflow:hidden; border:1px solid var(--border); }
  .video-embed iframe { display:block; width:100%; aspect-ratio:16/9; border:none; }
  .video-link-card { margin-top:10px; border:1px solid var(--border); border-radius:12px; padding:12px;
    display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); background:var(--bg); }
  .video-link-card .play-icon { font-size:20px; }
  .video-link-card .site-name { font-size:13px; color:var(--sub); }
  .post .actions { display:flex; gap:16px; margin-top:10px; align-items:center; }
  .action-btn { background:none; border:none; cursor:pointer; color:var(--sub); font-size:14px; display:flex; align-items:center; gap:5px; }
  .action-btn.liked { color:var(--like); }
  .action-btn.reposted { color:var(--repost); }
  .delete-btn { margin-left:auto; background:none; border:none; color:var(--sub); font-size:13px; cursor:pointer; }
  .comments { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); display:none; }
  .comments.open { display:block; }
  .comment { font-size:13px; margin-bottom:6px; }
  .comment b { color:var(--text); }
  .comment-row { display:flex; gap:6px; margin-top:8px; }
  .comment-row input { flex:1; border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:8px; padding:6px 10px; font-size:13px; }
  .comment-row button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
  #empty { text-align:center; color:var(--sub); margin-top:60px; font-size:14px; }

  #authModal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:20; padding:16px; }
  #authModal.open { display:flex; }
  #authBox { background:var(--card); border-radius:16px; padding:20px; width:100%; max-width:340px; }
  #authBox h2 { margin:0 0 12px; font-size:18px; }
  #authBox input { width:100%; padding:10px 12px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:14px; }
  #authBox button.submit { width:100%; background:var(--accent); color:#fff; border:none; border-radius:20px;
    padding:10px; font-size:14px; font-weight:600; cursor:pointer; margin-top:4px; }
  #authBox .switch { text-align:center; font-size:13px; color:var(--sub); margin-top:12px; cursor:pointer; }
  #authBox .close { text-align:center; font-size:13px; color:var(--sub); margin-top:8px; cursor:pointer; }
  #authError { color:var(--like); font-size:12px; margin-top:-4px; margin-bottom:8px; min-height:14px; }
  .auth-tabs { display:flex; gap:8px; margin-bottom:14px; }
  .auth-tabs .tab { flex:1; padding:8px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg); color:var(--sub); cursor:pointer; font-size:13px; }
  .auth-tabs .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Pulse<span>.</span></h1>
  <div id="authArea"></div>
</header>
<main>
  <div id="loginPrompt" style="display:none">Log in to post, like, repost, and reply.</div>
  <div id="composer" style="display:none">
    <textarea id="postText" placeholder="What's happening?" maxlength="280"></textarea>
    <div class="row">
      <span id="charCount">280</span>
      <button class="post-btn" id="postBtn">Post</button>
    </div>
  </div>
  <input id="searchInput" placeholder="Search posts or #hashtags…">
  <div id="feed"></div>
  <div id="empty" style="display:none">No posts yet — be the first.</div>
</main>

<div id="authModal">
  <div id="authBox">
    <h2 id="authTitle">Log in</h2>
    <div class="auth-tabs">
      <button class="tab active" id="tabEmail">Email</button>
      <button class="tab" id="tabPhone">Phone</button>
    </div>

    <div id="emailFields">
      <input id="authUsername" placeholder="Username" style="display:none">
      <input id="authEmail" placeholder="Email" type="email">
      <input id="authPassword" placeholder="Password" type="password">
      <div id="authError"></div>
      <button class="submit" id="authSubmit">Log in</button>
      <div class="switch" id="authSwitch">Don't have an account? Sign up</div>
      <div class="switch" id="forgotLink" style="margin-top:4px;">Forgot password?</div>
    </div>

    <div id="resetFields" style="display:none">
      <p style="font-size:13px;color:var(--sub);margin:0 0 10px;">Enter your email and we'll send a reset link.</p>
      <input id="resetEmail" placeholder="Email" type="email">
      <div id="resetError" style="color:var(--like);font-size:12px;margin-top:-4px;margin-bottom:8px;min-height:14px;"></div>
      <button class="submit" id="sendResetBtn">Send reset link</button>
      <div class="switch" id="backToLogin">Back to log in</div>
    </div>

    <div id="newPasswordFields" style="display:none">
      <p style="font-size:13px;color:var(--sub);margin:0 0 10px;">Choose a new password.</p>
      <input id="newPassword" placeholder="New password" type="password">
      <div id="newPasswordError" style="color:var(--like);font-size:12px;margin-top:-4px;margin-bottom:8px;min-height:14px;"></div>
      <button class="submit" id="setNewPasswordBtn">Update password</button>
    </div>

    <div id="phoneFields" style="display:none">
      <input id="authPhone" placeholder="Phone number, e.g. +15551234567" type="tel">
      <button class="submit" id="sendCodeBtn">Send code</button>
      <div id="phoneStep2" style="display:none">
        <input id="authOtp" placeholder="6-digit code" maxlength="6" inputmode="numeric">
        <button class="submit" id="verifyCodeBtn">Verify</button>
      </div>
      <div id="phoneUsernameStep" style="display:none">
        <input id="authPhoneUsername" placeholder="Choose a username">
        <button class="submit" id="finishPhoneBtn">Finish</button>
      </div>
      <div id="phoneError" style="color:var(--like);font-size:12px;margin-top:6px;min-height:14px;"></div>
    </div>

    <div class="close" id="authClose">Cancel</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://mzjavsxkivmdtcivpneu.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16amF2c3hraXZtZHRjaXZwbmV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDMzODEsImV4cCI6MjEwNTY3OTM4MX0.ysqYUHxBhTsDQJF375hZMPDoJ-IRdX4_hhiD9pneSCc";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const feedEl = document.getElementById('feed');
  const emptyEl = document.getElementById('empty');
  const textEl = document.getElementById('postText');
  const postBtn = document.getElementById('postBtn');
  const charCount = document.getElementById('charCount');
  const authArea = document.getElementById('authArea');
  const composerEl = document.getElementById('composer');
  const loginPromptEl = document.getElementById('loginPrompt');
  const searchInput = document.getElementById('searchInput');

  const authModal = document.getElementById('authModal');
  const authTitle = document.getElementById('authTitle');
  const authUsername = document.getElementById('authUsername');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authError = document.getElementById('authError');
  const authSubmit = document.getElementById('authSubmit');
  const authSwitch = document.getElementById('authSwitch');
  const authClose = document.getElementById('authClose');
  const tabEmail = document.getElementById('tabEmail');
  const tabPhone = document.getElementById('tabPhone');
  const emailFields = document.getElementById('emailFields');
  const phoneFields = document.getElementById('phoneFields');
  const authPhone = document.getElementById('authPhone');
  const sendCodeBtn = document.getElementById('sendCodeBtn');
  const phoneStep2 = document.getElementById('phoneStep2');
  const authOtp = document.getElementById('authOtp');
  const verifyCodeBtn = document.getElementById('verifyCodeBtn');
  const phoneUsernameStep = document.getElementById('phoneUsernameStep');
  const authPhoneUsername = document.getElementById('authPhoneUsername');
  const finishPhoneBtn = document.getElementById('finishPhoneBtn');
  const phoneError = document.getElementById('phoneError');
  const forgotLink = document.getElementById('forgotLink');
  const resetFields = document.getElementById('resetFields');
  const resetEmail = document.getElementById('resetEmail');
  const resetError = document.getElementById('resetError');
  const sendResetBtn = document.getElementById('sendResetBtn');
  const backToLogin = document.getElementById('backToLogin');
  const newPasswordFields = document.getElementById('newPasswordFields');
  const newPassword = document.getElementById('newPassword');
  const newPasswordError = document.getElementById('newPasswordError');
  const setNewPasswordBtn = document.getElementById('setNewPasswordBtn');

  let mode = 'login';
  let session = null;
  let myProfile = null;
  let allPosts = [];
  let openComments = new Set();

  textEl.addEventListener('input', () => charCount.textContent = 280 - textEl.value.length);

  function openAuth(which) {
    mode = which;
    authTitle.textContent = which === 'login' ? 'Log in' : 'Sign up';
    authUsername.style.display = which === 'signup' ? 'block' : 'none';
    authSubmit.textContent = which === 'login' ? 'Log in' : 'Sign up';
    authSwitch.textContent = which === 'login' ? "Don't have an account? Sign up" : "Already have an account? Log in";
    authError.textContent = '';
    resetFields.style.display = 'none';
    newPasswordFields.style.display = 'none';
    switchTab('email');
    authModal.classList.add('open');
  }

  function switchTab(tab) {
    tabEmail.classList.toggle('active', tab === 'email');
    tabPhone.classList.toggle('active', tab === 'phone');
    emailFields.style.display = tab === 'email' ? 'block' : 'none';
    phoneFields.style.display = tab === 'phone' ? 'block' : 'none';
    // reset phone flow state each time the tab is opened
    authPhone.value = ''; authOtp.value = ''; authPhoneUsername.value = '';
    phoneStep2.style.display = 'none';
    phoneUsernameStep.style.display = 'none';
    sendCodeBtn.style.display = 'inline-block';
    authPhone.style.display = 'block';
    phoneError.textContent = '';
    pendingPhoneUser = null;
  }
  tabEmail.addEventListener('click', () => switchTab('email'));
  tabPhone.addEventListener('click', () => switchTab('phone'));

  forgotLink.addEventListener('click', () => {
    emailFields.style.display = 'none';
    resetFields.style.display = 'block';
    resetEmail.value = authEmail.value || '';
    resetError.textContent = '';
  });
  backToLogin.addEventListener('click', () => {
    resetFields.style.display = 'none';
    emailFields.style.display = 'block';
  });
  sendResetBtn.addEventListener('click', async () => {
    resetError.textContent = '';
    const email = resetEmail.value.trim();
    if (!email) { resetError.textContent = 'Enter your email.'; return; }
    sendResetBtn.disabled = true;
    const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
    sendResetBtn.disabled = false;
    if (error) { resetError.textContent = error.message; return; }
    resetError.style.color = 'var(--repost)';
    resetError.textContent = 'Check your email for a reset link.';
  });
  setNewPasswordBtn.addEventListener('click', async () => {
    newPasswordError.textContent = '';
    const pw = newPassword.value;
    if (!pw || pw.length < 6) { newPasswordError.textContent = 'Password must be at least 6 characters.'; return; }
    setNewPasswordBtn.disabled = true;
    const { error } = await client.auth.updateUser({ password: pw });
    setNewPasswordBtn.disabled = false;
    if (error) { newPasswordError.textContent = error.message; return; }
    authModal.classList.remove('open');
    refreshSession();
  });

  // If this page was opened from a password-reset email link, Supabase fires this event.
  client.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      authTitle.textContent = 'Reset password';
      emailFields.style.display = 'none';
      phoneFields.style.display = 'none';
      resetFields.style.display = 'none';
      newPasswordFields.style.display = 'block';
      authModal.classList.add('open');
    }
  });

  let pendingPhoneUser = null;

  sendCodeBtn.addEventListener('click', async () => {
    phoneError.textContent = '';
    const phone = authPhone.value.trim();
    if (!phone.startsWith('+')) { phoneError.textContent = 'Include country code, e.g. +15551234567'; return; }
    sendCodeBtn.disabled = true;
    const { error } = await client.auth.signInWithOtp({ phone });
    sendCodeBtn.disabled = false;
    if (error) { phoneError.textContent = error.message; return; }
    phoneStep2.style.display = 'block';
    sendCodeBtn.style.display = 'none';
    authPhone.style.display = 'none';
  });

  verifyCodeBtn.addEventListener('click', async () => {
    phoneError.textContent = '';
    const phone = authPhone.value.trim() || pendingPhoneUser?.phone;
    const token = authOtp.value.trim();
    if (!token) { phoneError.textContent = 'Enter the code you received.'; return; }
    verifyCodeBtn.disabled = true;
    const { data, error } = await client.auth.verifyOtp({ phone: phone, token, type: 'sms' });
    verifyCodeBtn.disabled = false;
    if (error) { phoneError.textContent = error.message; return; }
    const { data: prof } = await client.from('profiles').select('*').eq('id', data.user.id).single();
    if (prof) {
      authModal.classList.remove('open');
      refreshSession();
    } else {
      pendingPhoneUser = data.user;
      phoneStep2.style.display = 'none';
      phoneUsernameStep.style.display = 'block';
    }
  });

  finishPhoneBtn.addEventListener('click', async () => {
    phoneError.textContent = '';
    const username = authPhoneUsername.value.trim();
    if (!username) { phoneError.textContent = 'Pick a username.'; return; }
    finishPhoneBtn.disabled = true;
    const { error } = await client.from('profiles').insert({ id: pendingPhoneUser.id, username });
    finishPhoneBtn.disabled = false;
    if (error) { phoneError.textContent = 'Username taken or invalid: ' + error.message; return; }
    authModal.classList.remove('open');
    refreshSession();
  });
  authClose.addEventListener('click', () => authModal.classList.remove('open'));
  authSwitch.addEventListener('click', () => openAuth(mode === 'login' ? 'signup' : 'login'));

  authSubmit.addEventListener('click', async () => {
    authError.textContent = '';
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || !password) { authError.textContent = 'Email and password required.'; return; }
    authSubmit.disabled = true;
    if (mode === 'signup') {
      const username = authUsername.value.trim();
      if (!username) { authError.textContent = 'Pick a username.'; authSubmit.disabled = false; return; }
      const { data, error } = await client.auth.signUp({ email, password });
      if (error) { authError.textContent = error.message; authSubmit.disabled = false; return; }
      if (data.user) {
        const { error: profErr } = await client.from('profiles').insert({ id: data.user.id, username });
        if (profErr) { authError.textContent = 'Username taken or invalid: ' + profErr.message; authSubmit.disabled = false; return; }
      }
    } else {
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) { authError.textContent = error.message; authSubmit.disabled = false; return; }
    }
    authSubmit.disabled = false;
    authModal.classList.remove('open');
    await refreshSession();
  });

  async function refreshSession() {
    const { data } = await client.auth.getSession();
    session = data.session;
    if (session) {
      const { data: prof } = await client.from('profiles').select('*').eq('id', session.user.id).single();
      myProfile = prof;
    } else {
      myProfile = null;
    }
    renderAuthArea();
    loadPosts();
  }

  function renderAuthArea() {
    if (session && myProfile) {
      authArea.innerHTML = `<span>@${escapeHtml(myProfile.username)}</span><button class="ghost" id="logoutBtn">Log out</button>`;
      document.getElementById('logoutBtn').addEventListener('click', async () => { await client.auth.signOut(); refreshSession(); });
      composerEl.style.display = 'block';
      loginPromptEl.style.display = 'none';
    } else {
      authArea.innerHTML = `<button id="loginBtn">Log in</button>`;
      document.getElementById('loginBtn').addEventListener('click', () => openAuth('login'));
      composerEl.style.display = 'none';
      loginPromptEl.style.display = 'block';
    }
  }

  function timeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'now';
    if (s < 3600) return Math.floor(s/60) + 'm';
    if (s < 86400) return Math.floor(s/3600) + 'h';
    return Math.floor(s/86400) + 'd';
  }
  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function formatBody(text) {
    return escapeHtml(text).replace(/#(\w+)/g, '<span class="tag">#$1</span>');
  }

  function detectVideo(text) {
    const urls = text.match(/https?:\/\/[^\s]+/g) || [];
    for (const url of urls) {
      const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/);
      if (yt) return `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen loading="lazy"></iframe></div>`;
      const vimeo = url.match(/vimeo\.com\/(\d+)/);
      if (vimeo) return `<div class="video-embed"><iframe src="https://player.vimeo.com/video/${vimeo[1]}" allowfullscreen loading="lazy"></iframe></div>`;
      const site = url.match(/(?:www\.)?(tiktok|instagram|x|twitter|twitch)\.com/) || url.match(/(?:www\.)?(twitch)\.tv/);
      if (site) {
        const names = { tiktok: 'TikTok', instagram: 'Instagram', x: 'X', twitter: 'X', twitch: 'Twitch' };
        return `<a class="video-link-card" href="${escapeHtml(url)}" target="_blank" rel="noopener"><span class="play-icon">▶️</span><span><div>Watch on ${names[site[1]]}</div><div class="site-name">${escapeHtml(url)}</div></span></a>`;
      }
    }
    return '';
  }

  async function loadPosts() {
    const { data: posts, error } = await client.from('posts').select('*, profiles(username)').order('created_at', { ascending: false }).limit(100);
    if (error) { console.error(error); return; }
    const { data: likes } = await client.from('likes').select('*');
    const { data: reposts } = await client.from('reposts').select('*');
    allPosts = posts.map(p => ({
      ...p,
      username: p.profiles?.username || 'unknown',
      likeCount: likes.filter(l => l.post_id === p.id).length,
      repostCount: reposts.filter(r => r.post_id === p.id).length,
      likedByMe: session ? likes.some(l => l.post_id === p.id && l.user_id === session.user.id) : false,
      repostedByMe: session ? reposts.some(r => r.post_id === p.id && r.user_id === session.user.id) : false,
    }));
    renderPosts();
  }

  function renderPosts() {
    const q = searchInput.value.trim().toLowerCase();
    const posts = q ? allPosts.filter(p => p.text.toLowerCase().includes(q) || p.username.toLowerCase().includes(q)) : allPosts;
    emptyEl.style.display = posts.length ? 'none' : 'block';
    feedEl.innerHTML = posts.map(p => `
      <div class="post" data-post-id="${p.id}">
        <div class="meta"><span>@${escapeHtml(p.username)}</span><span>${timeAgo(p.created_at)}</span></div>
        <div class="body">${formatBody(p.text)}</div>
        ${detectVideo(p.text)}
        <div class="actions">
          <button class="action-btn like-btn ${p.likedByMe ? 'liked' : ''}" data-id="${p.id}">${p.likedByMe ? '♥' : '♡'} ${p.likeCount}</button>
          <button class="action-btn repost-btn ${p.repostedByMe ? 'reposted' : ''}" data-id="${p.id}">🔁 ${p.repostCount}</button>
          <button class="action-btn comment-btn" data-id="${p.id}">💬</button>
          ${session && p.user_id === session.user.id ? `<button class="delete-btn" data-id="${p.id}">Delete</button>` : ''}
        </div>
        <div class="comments ${openComments.has(p.id) ? 'open' : ''}" data-comments-for="${p.id}">
          <div class="comment-list">Loading…</div>
          ${session ? `<div class="comment-row"><input placeholder="Reply…" class="comment-input" maxlength="200"><button class="comment-send" data-id="${p.id}">Send</button></div>` : ''}
        </div>
      </div>
    `).join('');
    openComments.forEach(id => loadComments(id));
  }

  async function loadComments(postId) {
    const container = feedEl.querySelector(`[data-comments-for="${postId}"] .comment-list`);
    if (!container) return;
    const { data, error } = await client.from('comments').select('*, profiles(username)').eq('post_id', postId).order('created_at', { ascending: true }).limit(200);
    if (error) { container.textContent = 'Could not load comments.'; return; }
    container.innerHTML = data.length
      ? data.map(c => `<div class="comment"><b>@${escapeHtml(c.profiles?.username || 'unknown')}</b>: ${escapeHtml(c.text)}</div>`).join('')
      : '<div class="comment" style="color:var(--sub)">No replies yet.</div>';
  }

  searchInput.addEventListener('input', renderPosts);

  postBtn.addEventListener('click', async () => {
    if (!session) return openAuth('login');
    const text = textEl.value.trim();
    if (!text) return;
    postBtn.disabled = true;
    const { error } = await client.from('posts').insert({ text, user_id: session.user.id });
    postBtn.disabled = false;
    if (error) { alert('Could not post: ' + error.message); return; }
    textEl.value = '';
    charCount.textContent = '280';
  });

  feedEl.addEventListener('click', async (e) => {
    const likeBtn = e.target.closest('.like-btn');
    const repostBtn = e.target.closest('.repost-btn');
    const commentBtn = e.target.closest('.comment-btn');
    const deleteBtn = e.target.closest('.delete-btn');
    const sendBtn = e.target.closest('.comment-send');

    if (!session && (likeBtn || repostBtn || sendBtn)) { openAuth('login'); return; }

    if (likeBtn) {
      const id = likeBtn.dataset.id;
      const post = allPosts.find(p => p.id === id);
      if (post.likedByMe) {
        await client.from('likes').delete().eq('post_id', id).eq('user_id', session.user.id);
      } else {
        await client.from('likes').insert({ post_id: id, user_id: session.user.id });
      }
      loadPosts();
      return;
    }

    if (repostBtn) {
      const id = repostBtn.dataset.id;
      const post = allPosts.find(p => p.id === id);
      if (post.repostedByMe) {
        await client.from('reposts').delete().eq('post_id', id).eq('user_id', session.user.id);
      } else {
        await client.from('reposts').insert({ post_id: id, user_id: session.user.id });
      }
      loadPosts();
      return;
    }

    if (commentBtn) {
      const id = commentBtn.dataset.id;
      if (openComments.has(id)) openComments.delete(id); else openComments.add(id);
      renderPosts();
      return;
    }

    if (deleteBtn) {
      const id = deleteBtn.dataset.id;
      if (!confirm('Delete this post?')) return;
      const { error } = await client.from('posts').delete().eq('id', id);
      if (error) { alert('Could not delete: ' + error.message); return; }
      return;
    }

    if (sendBtn) {
      const id = sendBtn.dataset.id;
      const input = feedEl.querySelector(`[data-comments-for="${id}"] .comment-input`);
      const text = input.value.trim();
      if (!text) return;
      sendBtn.disabled = true;
      const { error } = await client.from('comments').insert({ post_id: id, text, user_id: session.user.id });
      sendBtn.disabled = false;
      if (error) { alert('Could not comment: ' + error.message); return; }
      input.value = '';
      loadComments(id);
    }
  });

  client
    .channel('pulse-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => loadPosts())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'likes' }, () => loadPosts())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reposts' }, () => loadPosts())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, (payload) => {
      const postId = payload.new?.post_id || payload.old?.post_id;
      if (postId && openComments.has(postId)) loadComments(postId);
    })
    .subscribe();

  refreshSession();
</script>
</body>
</html>
